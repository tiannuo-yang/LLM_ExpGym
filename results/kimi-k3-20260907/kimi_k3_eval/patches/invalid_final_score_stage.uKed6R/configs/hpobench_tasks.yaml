# HPOBench task definitions used by the tuning scenario.
#
# The paper reports results on 9 of these tasks:
#   - NAS-101:  hpobench:nasbench101:A, :B, :C
#   - NAS-201:  hpobench:nasbench201:cifar10-valid, :cifar100, :imagenet16-120
#   - ParamNet: hpobench:paramnet_adult, :paramnet_higgs, :paramnet_letter
# Other entries (extra ParamNet variants, time-mode variants, the SVM
# surrogate) ship for extensibility and were not part of the main sweep.
#
version: 1
tasks:
  "hpobench:nasbench101:A":
    fidelity:
      budget:
        type: ordinal
        choices: [4, 12, 36, 108]
        default: 108
        meaning: training epochs
  "hpobench:nasbench101:B":
    fidelity:
      budget:
        type: ordinal
        choices: [4, 12, 36, 108]
        default: 108
        meaning: training epochs
  "hpobench:nasbench101:C":
    fidelity:
      budget:
        type: ordinal
        choices: [4, 12, 36, 108]
        default: 108
        meaning: training epochs
  "hpobench:nasbench201:cifar10-valid":
    fidelity:
      epoch:
        type: int
        min: 1
        max: 200
        default: 200
        meaning: training epochs (1-indexed)
  "hpobench:nasbench201:cifar100":
    fidelity:
      epoch:
        type: int
        min: 1
        max: 200
        default: 200
        meaning: training epochs (1-indexed)
  "hpobench:nasbench201:imagenet16-120":
