[project]
name = "qwen38-expgym-serving-runtime"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sglang==0.5.17",
  "torch==2.11.0+cu129",
  "torchaudio==2.11.0+cu129",
  "torchvision==0.26.0+cu129",
  "quack-kernels==0.6.1",
  "flash-attn-4==4.0.0b19",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
prerelease = "if-necessary-or-explicit"
override-dependencies = [
  "cuda-python>=12,<13",
  "flashinfer-python[cu12]==0.6.15.post1",
  "nvidia-cutlass-dsl==4.6.0",
  "humming-kernels==0.1.10",
  "sglang-kernel @ https://github.com/sgl-project/whl/releases/download/v0.4.5/sglang_kernel-0.4.5%2Bcu129-cp310-abi3-manylinux2014_x86_64.whl",
  "sgl-deep-gemm @ https://github.com/sgl-project/whl/releases/download/v0.1.5.post1/sgl_deep_gemm-0.1.5.post1%2Bcu129-py3-none-manylinux2014_x86_64.whl",
]

[tool.uv.sources]
torch = { index = "pytorch-cu129" }
torchaudio = { index = "pytorch-cu129" }
torchvision = { index = "pytorch-cu129" }

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
